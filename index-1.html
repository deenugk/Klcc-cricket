<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Scorer</title>
<style id="css">
:root{--bg:#f4f6f1;--card:#fff;--tx:#1b2a1b;--mu:#6b7a6b;--ac:#1f7a3d;--ac2:#e8f3ea;--bd:#d9e0d6;--rd:#c0392b;--yl:#b7791f;--b2:#2f6fb5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a13;--card:#1b261c;--tx:#e8f0e8;--mu:#93a393;--ac:#4cc171;--ac2:#223825;--bd:#2f3f30;--rd:#ef6a5b;--yl:#e6b04a;--b2:#6aa7e8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a13;--card:#1b261c;--tx:#e8f0e8;--mu:#93a393;--ac:#4cc171;--ac2:#223825;--bd:#2f3f30;--rd:#ef6a5b;--yl:#e6b04a;--b2:#6aa7e8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tap{cursor:pointer}.tap:active{opacity:.7}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.live{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.big{font-size:52px;font-weight:800;line-height:1}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px 0;font-weight:700;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;padding:14px}
button.on{background:var(--yl);color:#fff;border-color:var(--yl)}
button.w{color:var(--rd);border-color:var(--rd)}
button.sm{font-size:14px;padding:9px 14px;width:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.balls{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b{min-width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--ac2);color:var(--ac);padding:0 6px}
.b.W{background:var(--rd);color:#fff}.b.x{background:var(--yl);color:#fff}.b.f{background:var(--ac);color:#fff}
.res{background:var(--ac);color:#fff;border-radius:12px;padding:12px;font-weight:700;text-align:center;margin-bottom:12px}
.ov{margin-top:6px;font-size:13px;color:var(--mu)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}tr+tr td{border-top:1px solid var(--bd)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:var(--ac2);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--ac)}.kpi span{font-size:12px;color:var(--mu)}
.rep{white-space:pre-wrap;font-size:15px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
let M={}, view={n:'home'}, V=null, unlocked=false, canWrite=false, flag={w:false,c:0,k:'r'}, lastErr='', notice='', busy=false, loaded=false, online=true, pending=0, lastSig='', shareData={t:''};
const CFG={db:'https://klcc-cricket-scorer-default-rtdb.firebaseio.com',apiKey:'PASTE_WEB_API_KEY_HERE',email:'scorer@klcc.example'};
const RT='cricket.refresh',KEYK='cricket.key';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=n=>(n>0?'+':'')+n;
const runsOf=b=>b.t==='wd'||b.t==='nb'?1+b.r:b.r;
const legal=b=>b.t!=='wd'&&b.t!=='nb';
const ovs=l=>Math.floor(l/6)+'.'+(l%6);
const nm=S=>[S.a,S.b];
function sum(inn){let r=0,w=0,l=0;for(const b of inn.balls){r+=runsOf(b);if(b.w)w++;if(legal(b))l++}return{r,w,l}}
function done(S,i){const inn=S.inn[i],s=sum(inn);if(inn.closed||s.w>=10||s.l>=S.overs*6)return true;
 if(i===1&&inn.balls.length&&s.r>sum(S.inn[0]).r)return true;return false}
function result(S){
 if(!done(S,0)||!done(S,1))return null;
 const n=nm(S),a=sum(S.inn[0]),b=sum(S.inn[1]),t1=n[S.inn[0].bat],t2=n[S.inn[1].bat];
 if(b.r>a.r){const k=10-b.w;return{text:`${t2} won by ${k} wicket${k===1?'':'s'}`,win:t2,lose:t1}}
 if(b.r<a.r){const k=a.r-b.r;return{text:`${t1} won by ${k} run${k===1?'':'s'}`,win:t1,lose:t2}}
 return{text:'Match tied',win:null,t1,t2}}
function istats(S,i){
 const inn=S.inn[i];let r=0,w=0,l=0,f=0,x=0,d=0,ex={wd:0,nb:0,b:0,lb:0},ov=[],cr=0,cw=0,cl=0;
 for(const b of inn.balls){const v=runsOf(b);r+=v;cr+=v;if(b.w){w++;cw++}
  if(legal(b)){l++;cl++;if(b.t==='r'){if(b.r===4)f++;if(b.r===6)x++;if(b.r<=0)d++}}
  if(b.t==='wd')ex.wd+=v;else if(b.t==='nb')ex.nb+=1;else if(b.t==='b')ex.b+=b.r;else if(b.t==='lb')ex.lb+=b.r;
  if(legal(b)&&cl===6){ov.push({r:cr,w:cw});cr=0;cw=0;cl=0}}
 if(cl>0||cr!==0||cw>0)ov.push({r:cr,w:cw});
 const exT=ex.wd+ex.nb+ex.b+ex.lb;
 return{r,w,l,rr:l?r/(l/6):0,f,x,d,ex,exT,ov,team:nm(S)[inn.bat]}}

/* ---------- live database (Firebase Realtime Database over REST) ---------- */
const lsget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsset=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const apiKey=()=>CFG.apiKey.startsWith('PASTE')?(lsget(KEYK)||''):CFG.apiKey;
let tok={id:'',exp:0,refresh:''};
async function signIn(pw){
 const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(apiKey()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:CFG.email,password:pw,returnSecureToken:true})});
 const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||'sign-in failed');
 tok={id:d.idToken,exp:Date.now()+(+d.expiresIn-60)*1000,refresh:d.refreshToken};lsset(RT,tok.refresh)}
async function idToken(){
 if(!tok.refresh)throw new Error('Scoring is locked. Log in again.');
 if(Date.now()<tok.exp)return tok.id;
 const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(apiKey()),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(tok.refresh)});
 const d=await r.json();
 if(!r.ok){tok={id:'',exp:0,refresh:''};lsset(RT,null);unlocked=false;throw new Error('Your scorer session ended. Log in again.')}
 tok={id:d.id_token,exp:Date.now()+(+d.expires_in-60)*1000,refresh:d.refresh_token};lsset(RT,tok.refresh);return tok.id}
const dbu=(p,a)=>CFG.db.replace(/\/$/,'')+'/'+p+'.json'+(a?'?'+a:'');
// Normalise a match read from the database. Balls are stored as push-id children so several scorers can add without clashing.
function norm(S){
 const inn=[0,1].map(i=>{const x=(S.inn&&S.inn[i])||{};const raw=x.balls||{};
  const keys=Array.isArray(raw)?raw.map((_,k)=>String(k).padStart(6,'0')):Object.keys(raw).sort();
  const arr=Array.isArray(raw)?raw:keys.map(k=>raw[k]);
  return{bat:x.bat===undefined?i:x.bat,closed:!!x.closed,balls:arr.filter(Boolean),keys:keys.filter((k,j)=>arr[j])}});
 S.inn=inn;return S}
async function pull(){
 try{
  const r=await fetch(dbu('matches'),{cache:'no-store'});if(!r.ok)throw new Error('read '+r.status);
  const d=(await r.json())||{};
  if(pending>0)return;
  const m={};Object.keys(d).forEach(k=>{if(d[k]&&d[k].a)m[k]=norm(Object.assign({id:k},d[k]))});
  const sig=JSON.stringify(m);const was=online||!loaded;online=true;loaded=true;
  const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(sig!==lastSig&&!typing){M=m;lastSig=sig;render()}else if(!was)render();
 }catch(e){online=false;loaded=true;render()}}
let chain=Promise.resolve();
function op(method,path,body){
 pending++;
 chain=chain.then(async()=>{const t=await idToken();
  const r=await fetch(dbu(path,'auth='+encodeURIComponent(t)),{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status===401?'Not allowed to save. Check the scorer passcode setup.':'Could not save ('+r.status+')')})
 .catch(e=>{lastErr=e.message;render()})
 .finally(()=>{pending--;if(!pending){lastSig='';pull()}})}
function delMatch(){if(!confirm('Delete this match for everyone?'))return;const id=view.id;delete M[id];view={n:'home'};op('DELETE','matches/'+id);render()}
const base=()=>location.href.split('#')[0].split('?')[0];
function scoreText(S){const n=nm(S),a=sum(S.inn[0]),b=sum(S.inn[1]),r=result(S);
 let t=`🏏 ${S.a} v ${S.b} (${S.overs} overs)\n${n[S.inn[0].bat]}: ${a.r}/${a.w} (${ovs(a.l)} ov)`;
 if(S.inn[1].balls.length)t+=`\n${n[S.inn[1].bat]}: ${b.r}/${b.w} (${ovs(b.l)} ov)`;
 if(r)t+='\n'+r.text;else if(done(S,0)){t+=`\nNeed ${a.r+1-b.r} from ${S.overs*6-b.l} balls`}
 return t}
function shareInit(){const S=M[view.id];shareData={t:S?scoreText(S):''}}
async function copyTxt(id){const el=$(id);el.focus();el.select();let ok=false;
 try{await navigator.clipboard.writeText(el.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
 notice=ok?'Copied. Paste it into a message.':'Select the text above and copy it manually.';render()}
async function sendTxt(id){try{await navigator.share({text:$(id).value})}catch(e){}}
function shareHTML(){const S=M[view.id];
 const box=(id,v)=>`<textarea id="${id}" readonly rows="3" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px">${esc(v)}</textarea><div class="row" style="margin-top:8px"><button class="sm" style="flex:1" onclick="copyTxt('${id}')">Copy</button>${navigator.share?`<button class="sm" style="flex:1" onclick="sendTxt('${id}')">Share…</button>`:''}</div>`;
 return `<button class="sm" onclick="go('${S?'match':'home'}'${S?`,'${S.id}'`:''})">‹ Back</button><h1 style="margin-top:12px">Share</h1>
 <div class="card"><h2>Viewer link</h2><div class="mu" style="margin-bottom:8px">Send this once. Anyone who opens it sees every match and the scores update by themselves every few seconds. No account needed.</div>${box('lv',base())}</div>
 ${S?`<div class="card"><h2>Score as text</h2>${box('lt',shareData.t)}</div>`:''}`}
function loginHTML(){const needKey=CFG.apiKey.startsWith('PASTE')&&!lsget(KEYK);
 return `<button class="sm" onclick="go('home')">‹ Back</button><h1 style="margin-top:12px">Scorer login</h1><div class="card">
 <div class="mu">Enter the scorer passcode to score matches. Every scorer uses the same passcode.</div>
 ${needKey?`<label>Firebase Web API key (one time, on this device)</label><input id="apik" autocomplete="off" autocapitalize="off">`:''}
 <label>Scorer passcode</label><input id="code1" type="password" autocomplete="off">
 <div style="height:14px"></div><button class="p" onclick="doLogin()">Unlock scoring</button></div>`}
async function doLogin(){
 const k=$('apik');if(k&&k.value.trim())lsset(KEYK,k.value.trim());
 const v=$('code1').value;if(!v){lastErr='Enter the passcode.';render();return}
 if(!apiKey()){lastErr='The Firebase Web API key is needed once on this device.';render();return}
 try{await signIn(v);unlocked=true;lastErr='';view={n:'home'}}
 catch(e){const m=String(e.message);lastErr=/PASSWORD|CREDENTIALS|EMAIL_NOT_FOUND/.test(m)?'Wrong passcode.':/API key/i.test(m)?'The Web API key was not accepted.':'Could not sign in: '+m}
 render()}
function lock(){tok={id:'',exp:0,refresh:''};lsset(RT,null);unlocked=false;render()}

/* ---------- actions ---------- */
const go=(n,id)=>{view={n,id};flag.w=false;lastErr='';notice='';if(n==='share')shareInit();scrollTo(0,0);render();if(n==='home'||n==='analysis')pull()};
const openM=id=>go('match',id);
const cm=()=>view.ro?V:M[view.id];
function startNew(){
 const a=$('ta').value.trim()||'Team A',b=$('tb').value.trim()||'Team B',o=Math.max(1,Math.min(50,+$('ov').value||20));
 const id='m'+Date.now(),created=Date.now();
 M[id]=norm({id,created,a,b,overs:o,inn:[{bat:0,closed:false},{bat:1,closed:false}]});
 view={n:'match',id};
 op('PUT','matches/'+id,{id,created,a,b,overs:o,inn:{0:{bat:0,closed:false},1:{bat:1,closed:false}}});render()}
function activeInn(S){return done(S,0)?1:0}
function ballIn(t,r){const S=cm(),i=activeInn(S);if(done(S,i))return;
 const ball={t,r,w:!!(flag.w&&t!=='wd')};flag.w=false;
 S.inn[i].balls.push(ball);S.inn[i].keys.push('zz'+Date.now());
 op('POST','matches/'+S.id+'/inn/'+i+'/balls',ball);render()}
function undo(){const S=cm();
 const rm=i=>{const k=S.inn[i].keys.pop();S.inn[i].balls.pop();if(k&&k.slice(0,2)!=='zz')op('DELETE','matches/'+S.id+'/inn/'+i+'/balls/'+k);else if(k){lastErr='Wait a moment, then tap Undo again.'}};
 const cl=(i,v)=>{S.inn[i].closed=v;op('PUT','matches/'+S.id+'/inn/'+i+'/closed',v)};
 if(S.inn[1].closed)cl(1,false);
 else if(S.inn[1].balls.length)rm(1);
 else{const a=S.inn[0];if(a.closed&&sum(a).l<S.overs*6&&sum(a).w<10)cl(0,false);else if(a.balls.length)rm(0)}
 render()}
function endInn(){const S=cm(),i=activeInn(S);S.inn[i].closed=true;op('PUT','matches/'+S.id+'/inn/'+i+'/closed',true);render()}
const toggleW=()=>{flag.w=!flag.w;render()};
const stepC=d=>{flag.c=(parseInt(flag.c,10)||0)+d;render()};
function customBall(){const v=parseInt(flag.c,10);if(!isNaN(v))ballIn(flag.k,v)}
/* ---------- view helpers ---------- */
function chip(b){
 let t=b.t==='r'?String(b.r):b.t==='wd'?'Wd'+(b.r?sg(b.r):''):b.t==='nb'?'Nb'+(b.r?sg(b.r):''):(b.t==='b'?'B':'Lb')+b.r;
 if(b.w)t=(b.t==='r'&&b.r===0?'':t+' ')+'W';
 const c=b.w?'W':(b.t==='r'&&(b.r===4||b.r===6))?'f':b.t!=='r'?'x':'';
 return `<span class="b ${c}">${t}</span>`}
function barSvg(ov,color){
 if(!ov.length)return '';
 const W=320,H=110,n=ov.length,bw=W/Math.max(n,6),mx=Math.max(1,...ov.map(o=>o.r)),mn=Math.min(0,...ov.map(o=>o.r)),k=84/(mx-mn),y0=14+mx*k;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Runs per over"><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--bd)"/>`;
 ov.forEach((o,i)=>{const h=Math.abs(o.r)*k,y=o.r>=0?y0-h:y0,x=i*bw+bw*.15;
  s+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${Math.max(h,1)}" rx="2" fill="${color}"/>`;
  s+=`<text x="${x+bw*.35}" y="${H-3}" font-size="9" text-anchor="middle" fill="var(--mu)">${i+1}</text>`;
  if(o.r>=0)s+=`<text x="${x+bw*.35}" y="${y-3}" font-size="9" text-anchor="middle" fill="var(--tx)">${o.r}</text>`;
  for(let w=0;w<o.w;w++)s+=`<circle cx="${x+bw*.35}" cy="${(o.r>=0?y-14:y0-6)-w*7}" r="3" fill="var(--rd)"/>`});
 return s+'</svg>'}
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';

/* ---------- screens ---------- */
function homeHTML(){
 const L=Object.values(M).sort((a,b)=>b.created-a.created);
 const live=L.filter(S=>!result(S)),fin=L.filter(S=>result(S));
 const card=S=>{const r=result(S),n=nm(S),a=sum(S.inn[0]),b=sum(S.inn[1]);
  return `<div class="card tap" onclick="openM('${S.id}')"><div class="row sp"><b>${esc(S.a)} v ${esc(S.b)}</b>${r?`<span class="mu">${fmtDate(S.created)}</span>`:'<span class="live">LIVE</span>'}</div>
  <div class="mu" style="margin-top:6px">${esc(n[S.inn[0].bat])} ${a.r}/${a.w}${S.inn[1].balls.length?` · ${esc(n[S.inn[1].bat])} ${b.r}/${b.w}`:''}</div>
  ${r?`<div style="margin-top:6px;font-weight:600">${esc(r.text)}</div>`:''}</div>`};
 return `<h1>🏏 Cricket Scorer</h1>
 <div class="row" style="margin-bottom:12px"><button class="p" onclick="go('${unlocked?'new':'login'}')">+ New match</button><button class="p" style="background:var(--b2);border-color:var(--b2)" onclick="go('analysis')">Analysis</button></div>
 <div style="margin-bottom:12px"><button class="sm" style="width:100%" onclick="go('share')">Share viewer link</button></div>
 ${!loaded?'<div class="card mu">Loading matches…</div>':!L.length?'<div class="card mu">No matches yet. Matches started by a scorer appear here for everyone.</div>':''}
 ${live.length?'<div class="mu" style="margin:4px 0 8px">In progress</div>'+live.map(card).join(''):''}
 ${fin.length?'<div class="mu" style="margin:4px 0 8px">Finished · tap for summary</div>'+fin.map(card).join(''):''}`}

function newHTML(){return `<button class="sm" onclick="go('home')">‹ Back</button><h1 style="margin-top:12px">New match</h1><div class="card">
 <label>Team 1 (bats first)</label><input id="ta" placeholder="Team A">
 <label>Team 2</label><input id="tb" placeholder="Team B">
 <label>Overs per innings</label><input id="ov" type="number" inputmode="numeric" value="20">
 <div style="height:14px"></div><button class="p" onclick="startNew()">Start match</button></div>`}

function scoringHTML(S){
 const n=nm(S),i=activeInn(S),inn=S.inn[i],s=sum(inn),first=sum(S.inn[0]);
 const st=istats(S,i),over=Math.floor(s.l/6);let cnt=0,si=0;
 for(let k=0;k<inn.balls.length;k++){if(cnt===over*6){si=k;break}if(legal(inn.balls[k]))cnt++;si=k+1}
 const cb=inn.balls.slice(si),rr=s.l?(s.r/(s.l/6)).toFixed(2):'0.00';
 let chase='';
 if(i===1){const need=first.r+1-s.r,left=S.overs*6-s.l;chase=`Need <b>${need}</b> from <b>${left}</b> balls${left?` (RRR ${(need/(left/6)).toFixed(2)})`:''}`}
 return `<div class="card">
  <div class="mu">Innings ${i+1} · ${esc(n[inn.bat])} batting</div>
  <div class="row sp" style="align-items:flex-end;margin-top:6px"><div class="big">${s.r}/${s.w}</div>
  <div style="text-align:right"><div style="font-size:22px;font-weight:700">${ovs(s.l)}<span class="mu"> / ${S.overs} ov</span></div><div class="mu">RR ${rr}</div></div></div>
  ${i===1?`<div class="ov">Target ${first.r+1} · ${esc(n[S.inn[0].bat])} scored ${first.r}/${first.w}</div><div class="ov">${chase}</div>`:''}
  <div class="mu" style="margin-top:12px">This over</div>
  <div class="balls">${cb.length?cb.map(chip).join(''):'<span class="mu">–</span>'}</div></div>
 ${canWrite?`<div class="card">
  <div class="grid">${[0,1,2,3,4,6].map(r=>`<button onclick="ballIn('r',${r})">${r}</button>`).join('')}
  <button class="${flag.w?'on':'w'}" onclick="toggleW()">Wicket</button><button onclick="undo()">Undo</button></div>
  <div class="mu" style="margin:12px 0 0">Extras</div>
  <div class="grid"><button onclick="ballIn('wd',0)">Wide</button><button onclick="ballIn('nb',0)">No ball</button><button onclick="ballIn('b',1)">Bye 1</button><button onclick="ballIn('lb',1)">Leg bye 1</button>
  <button onclick="ballIn('wd',1)">Wd+1</button><button onclick="ballIn('nb',4)">Nb+4</button><button onclick="ballIn('b',4)">Bye 4</button><button onclick="endInn()">End inns</button></div>
  <div class="mu" style="margin:12px 0 0">Any runs (negatives allowed)</div>
  <div class="row" style="margin-top:8px"><button class="sm" style="padding:12px 16px" onclick="stepC(-1)">−</button>
   <input type="number" step="1" value="${esc(flag.c)}" oninput="flag.c=this.value" style="text-align:center;font-weight:700">
   <button class="sm" style="padding:12px 16px" onclick="stepC(1)">+</button></div>
  <div class="row" style="margin-top:8px"><select onchange="flag.k=this.value" style="flex:1">${[['r','Runs'],['wd','Wide +'],['nb','No ball +'],['b','Bye'],['lb','Leg bye']].map(o=>`<option value="${o[0]}" ${flag.k===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
   <button class="sm" style="flex:1;background:var(--ac);color:#fff;border-color:var(--ac);padding:12px" onclick="customBall()">Add ball</button></div>
  ${flag.w?'<div class="mu" style="margin-top:8px">Wicket armed. Tap the runs scored on that ball (0 for a plain dismissal).</div>':''}</div>`:''}
 <div class="card"><div class="mu" style="margin-bottom:6px">Scorecard</div>
  <table><tr><th></th><th>Score</th><th>Overs</th></tr>
  ${[0,1].filter(k=>k===0||S.inn[1].balls.length||i===1).map(k=>{const x=sum(S.inn[k]);return `<tr><td>${esc(n[S.inn[k].bat])}</td><td>${x.r}/${x.w}</td><td>${ovs(x.l)}</td></tr>`}).join('')}</table></div>`}

function summaryHTML(S){
 const r=result(S),n=nm(S),A=istats(S,0),B=istats(S,1);
 const best=x=>x.ov.length?Math.max(...x.ov.map(o=>o.r)):0;
 const row=(l,f)=>`<tr><td>${l}</td><td>${f(A)}</td><td>${f(B)}</td></tr>`;
 const moments=[A,B].map(x=>{if(!x.ov.length)return '';const m=Math.max(...x.ov.map(o=>o.r)),mi=x.ov.findIndex(o=>o.r===m),wk=Math.max(...x.ov.map(o=>o.w)),wi=x.ov.findIndex(o=>o.w===wk);
  return `<li>${esc(x.team)}: biggest over was over ${mi+1} (${m} run${m===1?'':'s'})${wk>0?`; most wickets in an over: ${wk} in over ${wi+1}`:''}.</li>`}).join('');
 return `<div class="res">${esc(r.text)}</div>
 <div class="card"><h2>Scorecard</h2><div class="sc"><table><tr><th></th><th>${esc(A.team)}</th><th>${esc(B.team)}</th></tr>
  ${row('Score',x=>x.r+'/'+x.w)}${row('Overs',x=>ovs(x.l))}${row('Run rate',x=>x.rr.toFixed(2))}${row('Fours',x=>x.f)}${row('Sixes',x=>x.x)}
  ${row('Dot balls',x=>x.d+' ('+pct(x.d,x.l)+')')}${row('Extras',x=>x.exT)}${row('Best over',x=>best(x))}</table></div></div>
 <div class="card"><h2>Runs per over</h2>
  <div class="mu">${esc(A.team)}</div>${barSvg(A.ov,'var(--ac)')}<div class="mu" style="margin-top:8px">${esc(B.team)}</div>${barSvg(B.ov,'var(--b2)')}
  <div class="mu" style="margin-top:6px"><span style="color:var(--rd)">●</span> wicket</div></div>
 <div class="card"><h2>Key moments</h2><ul style="margin:0;padding-left:18px">${moments}</ul></div>
 ${canWrite?`<div class="row" style="margin-bottom:12px"><button class="sm" style="flex:1" onclick="undo()">Undo last ball</button><button class="sm w" style="flex:1" onclick="delMatch()">Delete match</button></div>`:''}`}

function matchHTML(){
 const S=cm();if(!S)return `<button class="sm" onclick="go('home')">‹ Back</button><div class="card mu" style="margin-top:12px">${loaded?'This match no longer exists.':'Loading…'}</div>`;
 const r=result(S);
 return `<div class="row sp"><button class="sm" onclick="go('home')">‹ All matches</button><button class="sm" onclick="go('share','${S.id}')">Share</button></div>
 ${view.ro?`<div class="mu" style="margin-top:10px">Snapshot taken ${new Date(S.updated||S.created).toLocaleString()}. Ask the scorer for a newer link to see more.</div>`:''}
 <div class="row sp" style="margin:12px 0"><h1 style="margin:0">${esc(S.a)} v ${esc(S.b)}</h1>${r?'':'<span class="live">LIVE</span>'}</div>
 ${r?summaryHTML(S):scoringHTML(S)}
 ${!r&&canWrite?`<div class="row" style="margin-bottom:12px"><button class="sm w" onclick="delMatch()">Delete match</button></div>`:''}`}

function analysisHTML(){
 const D=Object.values(M).filter(S=>result(S)).sort((a,b)=>a.created-b.created);
 const back=`<button class="sm" onclick="go('home')">‹ All matches</button><h1 style="margin-top:12px">Analysis</h1>`;
 if(!D.length)return back+'<div class="card mu">Finish a match and the analysis across all games will appear here.</div>';
 const T={};const tm=n=>{const k=n.trim().toLowerCase();return T[k]||(T[k]={name:n,p:0,w:0,l:0,t:0,rf:0,bf:0,hi:-Infinity,lo:Infinity})};
 const g={f:0,x:0,d:0,l:0,r:0,ex:0,w:0,ch:0,chW:0,hi:null,bo:null,s1:0,s2:0,n:D.length};
 D.forEach(S=>{const res=result(S),a=istats(S,0),b=istats(S,1);
  [a,b].forEach((st,i)=>{const t=tm(st.team);t.rf+=st.r;t.bf+=st.l;t.hi=Math.max(t.hi,st.r);t.lo=Math.min(t.lo,st.r);
   g.f+=st.f;g.x+=st.x;g.d+=st.d;g.l+=st.l;g.r+=st.r;g.ex+=st.exT;g.w+=st.w;
   if(!g.hi||st.r>g.hi.r)g.hi={r:st.r,team:st.team,vs:i?a.team:b.team};
   const m=st.ov.length?Math.max(...st.ov.map(o=>o.r)):0;if(!g.bo||m>g.bo.r)g.bo={r:m,team:st.team}});
  g.s1+=a.r;g.s2+=b.r;tm(a.team).p++;tm(b.team).p++;g.ch++;
  if(res.win){tm(res.win).w++;tm(res.lose).l++;if(res.win===b.team)g.chW++}else{tm(res.t1).t++;tm(res.t2).t++}});
 const teams=Object.values(T).sort((x,y)=>y.w-x.w||(y.rf/y.bf||0)-(x.rf/x.bf||0));
 // totals chart
 const W=320,H=130,mx=Math.max(1,...D.flatMap(S=>[sum(S.inn[0]).r,sum(S.inn[1]).r])),gw=W/Math.max(D.length,4),k=95/mx;
 let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Innings totals per match">`;
 D.forEach((S,i)=>{const x=i*gw+gw*.1;[0,1].forEach(j=>{const v=Math.max(0,sum(S.inn[j]).r),h=v*k,bx=x+j*gw*.4;
  svg+=`<rect x="${bx}" y="${112-h}" width="${gw*.38}" height="${Math.max(h,1)}" rx="2" fill="${j?'var(--b2)':'var(--ac)'}"/><text x="${bx+gw*.19}" y="${108-h}" font-size="9" text-anchor="middle" fill="var(--tx)">${sum(S.inn[j]).r}</text>`});
  svg+=`<text x="${x+gw*.38}" y="125" font-size="9" text-anchor="middle" fill="var(--mu)">${i+1}</text>`});
 svg+='</svg>';
 const avg=(a,b)=>b?(a/b).toFixed(1):'–';
 return back+`<div class="card"><h2>All games (${g.n})</h2><div class="kpi">
  <div><b>${avg(g.s1,g.n)}</b><span>Avg 1st inns</span></div><div><b>${avg(g.s2,g.n)}</b><span>Avg 2nd inns</span></div><div><b>${pct(g.chW,g.ch)}</b><span>Chases won</span></div>
  <div><b>${g.l?(g.r/(g.l/6)).toFixed(2):'–'}</b><span>Run rate</span></div><div><b>${g.f}/${g.x}</b><span>Fours / sixes</span></div><div><b>${pct(g.d,g.l)}</b><span>Dot balls</span></div>
  <div><b>${avg(g.ex,g.n*2)}</b><span>Extras / inns</span></div><div><b>${avg(g.w,g.n*2)}</b><span>Wkts / inns</span></div><div><b>${pct(g.f*4+g.x*6,g.r)}</b><span>Runs in boundaries</span></div></div>
  <div class="mu" style="margin-top:10px">Highest total: <b>${g.hi.r}</b> by ${esc(g.hi.team)} vs ${esc(g.hi.vs)}. Best single over: <b>${g.bo.r}</b> runs (${esc(g.bo.team)}).</div></div>
 <div class="card"><h2>Team records</h2><div class="sc"><table><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Avg</th><th>RR</th><th>High</th><th>Low</th></tr>
  ${teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.l}</td><td>${t.t}</td><td>${avg(t.rf,t.p)}</td><td>${t.bf?(t.rf/(t.bf/6)).toFixed(2):'–'}</td><td>${t.hi}</td><td>${t.lo}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Innings totals by match</h2>${svg}<div class="mu"><span style="color:var(--ac)">■</span> 1st innings <span style="color:var(--b2)">■</span> 2nd innings</div></div>
 <div class="card"><h2>Results</h2><table>${D.slice().reverse().map((S,i)=>`<tr class="tap" onclick="openM('${S.id}')"><td>${D.length-i}. ${esc(S.a)} v ${esc(S.b)}</td><td>${esc(result(S).text)}</td></tr>`).join('')}</table></div>`}

function render(){
 canWrite=unlocked;
 const h=view.n==='share'?shareHTML():view.n==='login'?loginHTML():view.n==='new'?newHTML():view.n==='match'?matchHTML():view.n==='analysis'?analysisHTML():homeHTML();
 const f=lastErr?`<div class="card" style="color:var(--rd)">${esc(lastErr)}</div>`:'';
 const n=notice?`<div class="card" style="color:var(--ac)">${esc(notice)}</div>`:'';
 const st=!online?'Offline · retrying':pending?'Saving…':'Live · updates every few seconds';
 const foot=canWrite?`<div class="row sp" style="margin:8px 0"><span class="mu">Scoring unlocked · ${st}</span><button class="sm" onclick="lock()">Lock</button></div>`
  :`<div class="row sp" style="margin:8px 0"><span class="mu">View only · ${st}</span><button class="sm" onclick="go('login')">Scorer login</button></div>`;
 $('app').innerHTML=h+f+n+foot;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
(async()=>{
 const rt=lsget(RT);if(rt){tok.refresh=rt;unlocked=true;try{await idToken()}catch(e){}}
 render();await pull();setInterval(()=>{if(!document.hidden)pull()},5000)})();
</script>
</body>
</html>
